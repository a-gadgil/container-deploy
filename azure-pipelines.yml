# Disable post-merge triggers on main; runs strictly via PR Build Validation policy
trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageTag: '1.0.$(Build.BuildId)'
  registryServiceConnection: 'container-registry-conn'
  # Replace with your lowercase Docker Hub username (Docker ID)
  dockerhubUsername: 'baremetal24'

stages:
  # Stage 1: Detect modified runtimes in PR relative to main
  - stage: DetectChanges
    displayName: 'Detect Modified Containers'
    jobs:
      - job: CheckPaths
        steps:
          - checkout: self
            fetchDepth: '0'
          - bash: |
              git fetch origin main
              CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
              echo "Changed files in PR:"
              echo "$CHANGED_FILES"

              MATRIX_JSON="{"
              FIRST=true

              for svc in cpp-service python-service java-service go-service rust-service; do
                if echo "$CHANGED_FILES" | grep -q "^${svc}/" && [ -f "${svc}/Dockerfile" ]; then
                  echo "Queueing container build for: $svc"
                  if [ "$FIRST" = true ]; then
                    FIRST=false
                  else
                    MATRIX_JSON="${MATRIX_JSON},"
                  fi
                  MATRIX_JSON="${MATRIX_JSON}\"${svc}\":{\"serviceDir\":\"${svc}\"}"
                fi
              done

              MATRIX_JSON="${MATRIX_JSON}}"
              echo "Generated Matrix: $MATRIX_JSON"

              if [ "$MATRIX_JSON" = "{}" ]; then
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false"
              else
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
                echo "##vso[task.setvariable variable=serviceMatrix;isOutput=true]$MATRIX_JSON"
              fi
            name: setMatrix

  # Stage 2: Build & Push modified service images in parallel to Docker Hub
  - stage: BuildAndPush
    displayName: 'Build & Push to Docker Hub'
    dependsOn: DetectChanges
    condition: eq(dependencies.DetectChanges.outputs['CheckPaths.setMatrix.hasChanges'], 'true')
    jobs:
      - job: DockerBuildPush
        displayName: 'Build & Push'
        strategy:
          matrix: $[ stageDependencies.DetectChanges.CheckPaths.outputs['setMatrix.serviceMatrix'] ]
        steps:
          - task: Docker@2
            displayName: 'Build $(serviceDir) image'
            inputs:
              command: 'build'
              containerRegistry: '$(registryServiceConnection)'
              repository: '$(dockerhubUsername)/$(serviceDir)'
              Dockerfile: '$(serviceDir)/Dockerfile'
              buildContext: '$(serviceDir)'
              arguments: '--network=host'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Push $(serviceDir) to Docker Hub'
            inputs:
              command: 'push'
              containerRegistry: '$(registryServiceConnection)'
              repository: '$(dockerhubUsername)/$(serviceDir)'
              tags: |
                $(imageTag)
                latest

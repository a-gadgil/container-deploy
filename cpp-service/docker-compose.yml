services:
  cpp-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cpp-api:v1.0.0
    container_name: cpp-stack-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8083
      APP_ENV: container
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: cpp-stack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cpp-api
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
